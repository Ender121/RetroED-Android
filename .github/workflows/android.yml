name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: APK (armeabi-v7a + arm64-v8a)
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: 5.15.2

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Android SDK (platform 29 + build tools)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-29" "build-tools;29.0.3" > /dev/null

      # Qt 5.15 expects NDK r21e
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r21e
          add-to-path: false

      - uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android
          cache: true

      # ANDROID_ABIS (armeabi-v7a for 32-bit phones like the Moto C + arm64-v8a) comes from the .pro,
      # so this builds ONE multi-ABI APK
      - name: Configure
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir build && cd build
          qmake ../RetroEDv2/RetroEDv2.pro -spec android-clang CONFIG+=release

      # -k keeps going after an error so a single run lists every compile error
      - name: Compile
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          cd build
          make -k -j"$(nproc)" 2>&1 | tee ../compile.log

      - name: Package APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          cd build
          make -j"$(nproc)" apk 2>&1 | tee ../package.log

      # Release APKs come out unsigned (not installable), so sign with a throw-away debug key
      - name: Sign APK
        run: |
          cd build
          keytool -genkey -keystore debug.keystore -storepass android -keypass android \
                  -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=RetroED Debug,O=RetroED,C=US"
          UNSIGNED="$(find . -name '*.apk' | head -n 1)"
          echo "Found: $UNSIGNED"
          "$ANDROID_SDK_ROOT/build-tools/29.0.3/apksigner" sign \
              --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
              --out "$GITHUB_WORKSPACE/RetroED.apk" "$UNSIGNED"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroED-android
          path: RetroED.apk
          if-no-files-found: error

      # If something failed, print ONLY the error lines (short enough to paste)
      - name: Show errors
        if: failure()
        run: |
          echo "=== compile errors ==="
          grep -hE -A2 "error:|Error [0-9]|Project ERROR|undefined reference|fatal" compile.log package.log 2>/dev/null | head -n 120 || true
